name: Monitor de passagens

on:
  schedule:
    - cron: "17 11 * * *"    # todo dia às 08:17 (Brasília); plano grátis do SerpApi = 250 buscas/mês
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write            # necessário para salvar o historico.json

concurrency:
  group: monitor-passagens   # evita duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar preços (SerpApi)
        run: python monitor_passagens.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          if [ -f historico.json ]; then
            git add historico.json
            if ! git diff --staged --quiet; then
              git commit -m "Atualiza histórico de preços"
              git pull --rebase -X theirs origin main
              git push
            fi
          fi
