name: Monitor de passagens

on:
  schedule:
    - cron: "0 */6 * * *"   # a cada 6 horas (horário UTC)
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write            # necessário para salvar o historico.json

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Buscar preços
        run: python monitor_passagens.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Salvar histórico
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add historico.json
          if ! git diff --staged --quiet; then
            git commit -m "Atualiza histórico de preços"
            git push
          fi
