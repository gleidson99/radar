name: Monitor de passagens

on:
  schedule:
    - cron: "17 1,9,17 * * *"  # 3x por dia: ~22:17, 06:17 e 14:17 (Brasília), 2 buscas cada.
                               # O GitHub costuma atrasar estes horários (às vezes 1 a 3 horas).
  workflow_dispatch:         # permite rodar manualmente pelo botão "Run workflow"
    inputs:
      buscas:
        description: "Quantas buscas fazer (cada uma = 1 data de ida + 1 estadia; gasta da cota de 250/mês)"
        default: "6"
        required: false
      ida:
        description: "Opcional: data de ida específica (AAAA-MM-DD, ex. 2027-01-05). Vazio = rodízio de datas"
        default: ""
        required: false
      dias:
        description: "Opcional: estadias para essa data (ex. 21 ou 19,22,24). Vazio = 19 a 24"
        default: ""
        required: false
      parada:
        description: "Buscar agora também a opção com 3 dias em Istambul? (sim/não; gasta 1 busca)"
        default: "não"
        required: false
      origens:
        description: "Origens (CNF = monitor normal; outra opção, ex. GRU = teste que não grava histórico)"
        default: "CNF"
        required: false

permissions:
  contents: write            # necessário para salvar o historico.json

concurrency:
  group: monitor-passagens   # evita duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar preços (SerpApi)
        run: python monitor_passagens.py
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          ORIGENS: ${{ github.event.inputs.origens || 'CNF' }}
          BUSCAS_SERPAPI: ${{ github.event.inputs.buscas }}
          IDA_MANUAL: ${{ github.event.inputs.ida }}
          DIAS_MANUAL: ${{ github.event.inputs.dias }}
          PARADA_AGORA: ${{ github.event.inputs.parada }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}

      - name: Salvar histórico
        if: always()
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          if [ -f historico.json ]; then
            git add historico.json
            if ! git diff --staged --quiet; then
              git commit -m "Atualiza histórico de preços"
              git pull --rebase -X theirs origin main
              git push
            fi
          fi
