name: Sondagem Azul pelo Mundo

on:
  workflow_dispatch:   # só roda quando você clicar em "Run workflow"

jobs:
  sondar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium
      - name: Sondar o site
        run: python azul_sondagem.py
